[versions]
agp = "9.4.1"
kotlin = "2.4.21-RC"
baseline-profile-plugin = "1.5.0"
roborazzi = "1.76.0"

compile-sdk = "37"
min-sdk = "35"
target-sdk = "37"
java = "21"

androidx-core = "1.19.1"
activity-compose = "1.13.0"
material = "1.14.0"
# A floor, not a free choice: miuix 0.9.4 depends on JetBrains Compose 1.12.1, whose Android variants ARE
# the androidx artifacts, so every androidx.compose module resolves to the higher of this and 1.12.1.
# Keep this equal to the resolved version -- BuildConfig.COMPOSE_VERSION feeds the diagnostics page.
compose = "1.12.1"
constraintlayout-compose = "1.1.2"
navigation-event = "1.2.0-rc01"
lifecycle = "2.11.0"
documentfile = "1.1.0"
webkit = "1.18.0-rc01"
metrics-performance = "1.0.0"
profileinstaller = "1.4.1"
benchmark = "1.5.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
espresso = "3.7.0"
uiautomator = "2.4.0"

miuix = "0.9.4-5c91d5e5-SNAPSHOT"
backdrop = "2.0.1"
capsule = "2.1.3"
shapes = "1.2.1"
lucide-icons = "2.2.1"

shizuku = "13.1.5"
hidden-api-bypass = "6.1"
mmkv = "2.4.2"
mcp-kotlin-sdk = "0.15.0"
ktor = "3.6.0"
okhttp = "5.5.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization-json = "1.12.0-RC"
json = "20260814"
xmlpull = "1.1.3.4d_b4_min"
kxml2 = "2.3.0"
media3 = "1.11.1"
coil3 = "3.6.3"
zoomimage = "1.7.0"
ucrop = "2.2.11"
dav4jvm = "4.1.0"

junit4 = "4.13.2"
robolectric = "4.17"

# Displayed in the dependency diagnostics page; this identifies Xiaomi's Focus API contract.
focus-api = "1.4"

