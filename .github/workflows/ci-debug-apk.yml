name: CI / Debug APK
run-name: "D#${{ github.run_number }} - ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches:
      - master
    # Include every module, skip local-only tooling, then restore the reporter executed by CI.
    paths:
      - "**"
      - "!**/*.md"
      - "!.agents/**"
      - "!.claude/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!docs/**"
      - "!readme/**"
      - "!scripts/dev/**"
      - "!scripts/perf/**"
      - "!scripts/qa/**"
      - "scripts/qa/test_report.sh"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master
    paths:
      - "**"
      - "!**/*.md"
      - "!.agents/**"
      - "!.claude/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!docs/**"
      - "!readme/**"
      - "!scripts/dev/**"
      - "!scripts/perf/**"
      - "!scripts/qa/**"
      - "scripts/qa/test_report.sh"
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA/branch/tag to build (optional). Leave empty to build the latest commit on selected branch.
        required: false
        type: string
      publish-build-scan:
        description: Publish Gradle Build Scan data for this run.
        required: false
        type: boolean
        default: false

concurrency:
  # PR numbers distinguish same-named branches in different forks; manual targets are independent.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.commit || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  # Job 1: Build debug APK + verify signing
  build-debug-apk:
    name: Build debug APK
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
      EXPECTED_APK_SIGNER_SHA256: "0ef11332dc8107b78535bac6d3507c6c52c2224630c84efd8d44c3d921ff4fd8"
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because the version metadata counts commits back to the release tag --
          # but blobless, so the clone carries commits and trees only and no step reads a file
          # out of history.
          fetch-depth: 0
          filter: blob:none
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Build context
        id: context
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_OUTPUT}"
          echo "Commit: ${COMMIT_SHA}"
          echo "Short commit: ${SHORT_SHA}"
          echo "Run number: ${GITHUB_RUN_NUMBER}"

      - name: Setup Android Gradle build
        uses: ./.github/actions/setup-android-gradle-build
        with:
          android-build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          github-actor: ${{ env.GITHUB_ACTOR }}
          github-token: ${{ env.GITHUB_TOKEN }}
          # Only automatic master builds populate the shared Gradle cache.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
          build-scan-publish: ${{ inputs.publish-build-scan || false }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Compose artifact metadata
        id: meta
        uses: ./.github/actions/prepare-android-apk-artifact
        with:
          variant: debug
          metadata-path: app/build/outputs/apk/debug/output-metadata.json

      - name: Verify debug APK signing certificate
        env:
          APK_PATH: ${{ steps.meta.outputs.apk-path }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$("${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner" verify --print-certs "${APK_PATH}" \
            | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          echo "Debug signer SHA-256: ${ACTUAL_SHA256}"
          test "${ACTUAL_SHA256}" = "${EXPECTED_APK_SIGNER_SHA256}"

      - name: Prepare artifact
        id: artifact
        env:
          APK_PATH: ${{ steps.meta.outputs.apk-path }}
          APK_FILE_NAME: ${{ steps.meta.outputs.apk-file-name }}
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact-name }}
        run: |
          set -euo pipefail
          cp "${APK_PATH}" "${RUNNER_TEMP}/${APK_FILE_NAME}"
          echo "apk_file_name=${APK_FILE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload debug APK
        id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.artifact.outputs.apk_file_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Write artifact summary
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          APK_FILE_NAME: ${{ steps.artifact.outputs.apk_file_name }}
          APPLICATION_ID: ${{ steps.meta.outputs.application-id }}
          VARIANT_NAME: ${{ steps.meta.outputs.variant-name }}
          VERSION_NAME: ${{ steps.meta.outputs.version-name }}
          VERSION_CODE: ${{ steps.meta.outputs.version-code }}
          COMMIT_SHA: ${{ steps.context.outputs.commit_sha }}
          APK_SHA256: ${{ steps.meta.outputs.apk-sha256 }}
          ARTIFACT_DIGEST: ${{ steps.upload_apk.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          {
            echo "### Debug APK artifact"
            echo ""
            echo "- Artifact: [${ARTIFACT_NAME}](${ARTIFACT_URL})"
            echo "- File: \`${APK_FILE_NAME}\`"
            echo "- Application ID: \`${APPLICATION_ID}\`"
            echo "- Variant: \`${VARIANT_NAME}\`"
            echo "- Version: \`${VERSION_NAME}\` (\`${VERSION_CODE}\`)"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Run number: \`${GITHUB_RUN_NUMBER}\`"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Artifact archive SHA-256: \`${ARTIFACT_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Job 2: Unit tests — runs in PARALLEL with build-debug-apk.
  # Separate job so test failures don't block APK artifact upload, and both complete faster
  # than running sequentially (total time = max(build, test) instead of build + test).
  unit-tests:
    name: Unit tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the version metadata, blobless -- see the job above.
          fetch-depth: 0
          filter: blob:none
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Setup Android Gradle build
        uses: ./.github/actions/setup-android-gradle-build
        with:
          android-build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          github-actor: ${{ env.GITHUB_ACTOR }}
          github-token: ${{ env.GITHUB_TOKEN }}
          # One cache writer keeps test/benchmark jobs from evicting the shared build cache.
          cache-read-only: "true"
          build-scan-publish: ${{ inputs.publish-build-scan || false }}

      # Every module's tests, by the unqualified task name, never a list of modules. This ran only
      # `:app:testDebugUnitTest` until 2026-09-25, so the ~1,500 tests in the extracted modules
      # (feature-github, ui-liquid-glass, core-*, ...) never ran here; the paths-ignore comment
      # above describes the same failure for triggers. Compiling each module's tests compiles
      # its main code too, so the separate library compile step this replaced is covered.
      # `roborazzi.test.verify` compares the screenshot tests against their tracked goldens;
      # without it they only compose. `--continue` reports every failing module, not the first.
      # Included builds are independent: the Android task selector does not run build-logic tests.
      - name: Validate build logic, run unit tests (all modules) and verify screenshots
        id: unit_tests
        run: ./gradlew :build-logic:check testDebugUnitTest -Proborazzi.test.verify=true --continue --stacktrace

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: |
            */build/reports/tests/testDebugUnitTest/
            build-logic/build/reports/tests/test/
            build-logic/build/test-results/test/
            build-logic/build/reports/plugin-development/
            app/build/outputs/roborazzi/
          retention-days: 7

      - name: Write test summary
        if: ${{ !cancelled() }}
        env:
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          report_status=0
          scripts/qa/test_report.sh --slowest 10 > "${RUNNER_TEMP}/unit-test-summary.txt" || report_status=$?
          {
            echo "### Unit tests"
            echo ""
            echo "- Requested tasks: \`:build-logic:check\`, \`testDebugUnitTest\` (every Android module), screenshot verification enabled"
            echo "- Gradle test step: \`${TEST_OUTCOME}\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Run number: \`${GITHUB_RUN_NUMBER}\`"
            echo "- XML report exit code: \`${report_status}\` (0 passed, 1 failed, 3 no results)"
            echo ""
            echo '```text'
            cat "${RUNNER_TEMP}/unit-test-summary.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Successful runs supply the timing baseline too. Keep the small XML reports for two weeks;
      # HTML and screenshot diffs above remain failure-only. Reporting never replaces the test gate.
      - name: Upload unit test timing data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-timings
          path: |
            */build/test-results/testDebugUnitTest/TEST-*.xml
            build-logic/build/test-results/test/TEST-*.xml
            ${{ runner.temp }}/unit-test-summary.txt
          if-no-files-found: warn
          retention-days: 14
