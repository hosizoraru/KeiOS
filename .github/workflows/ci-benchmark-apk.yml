name: CI / Benchmark APK
run-name: "B#${{ github.run_number }} - ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches:
      - master
    # Exclusions, not inclusions. The hand-written module allowlist this replaces had gone stale:
    # core-download, core-notification, core-versioning, feature-keepalive and feature-github-engine
    # were all missing from it, so a commit touching only one of them built and tested nothing.
    # A missing entry here costs a run nobody needed; a missing entry there cost the run that was.
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "readme/**"
      - "scripts/dev/**"
      - "scripts/perf/**"
      - "scripts/qa/**"
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA/branch/tag to build (optional). Leave empty to build the latest commit on selected branch.
        required: false
        type: string
      publish-build-scan:
        description: Publish Gradle Build Scan data for this run.
        required: false
        type: boolean
        default: false
      run-lint-vital:
        description: Run lintVitalBenchmark during APK build.
        required: false
        type: boolean
        default: false

concurrency:
  # A manual build of another commit must not cancel the automatic master build.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.commit || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  build-benchmark-apk:
    name: Build benchmark APK
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
      EXPECTED_APK_SIGNER_SHA256: "0ef11332dc8107b78535bac6d3507c6c52c2224630c84efd8d44c3d921ff4fd8"
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because the version metadata counts commits back to the release tag --
          # but blobless, so the clone carries commits and trees only and no step reads a file
          # out of history.
          fetch-depth: 0
          filter: blob:none
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Build context
        id: context
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_OUTPUT}"
          echo "Commit: ${COMMIT_SHA}"
          echo "Short commit: ${SHORT_SHA}"
          echo "Run number: ${GITHUB_RUN_NUMBER}"

      - name: Setup Android Gradle build
        uses: ./.github/actions/setup-android-gradle-build
        with:
          android-build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          github-actor: ${{ env.GITHUB_ACTOR }}
          github-token: ${{ env.GITHUB_TOKEN }}
          # Read-only on purpose: only the debug APK job writes the Gradle cache, which is what
          # keeps the Actions cache from filling up. See the unit test job in ci-debug-apk.yml.
          cache-read-only: "true"
          build-scan-publish: ${{ inputs.publish-build-scan || false }}

      - name: Build benchmark APK
        env:
          RUN_LINT_VITAL: ${{ inputs.run-lint-vital || false }}
        run: |
          set -euo pipefail
          GRADLE_ARGS=(":app:assembleBenchmark" "--stacktrace")
          if [[ "${RUN_LINT_VITAL}" != "true" ]]; then
            GRADLE_ARGS+=("-x" "lintVitalBenchmark")
          fi
          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Compose artifact metadata
        id: meta
        uses: ./.github/actions/prepare-android-apk-artifact
        with:
          variant: benchmark
          metadata-path: app/build/outputs/apk/benchmark/output-metadata.json

      - name: Verify benchmark APK signing certificate
        env:
          APK_PATH: ${{ steps.meta.outputs.apk-path }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$("${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner" verify --print-certs "${APK_PATH}" \
            | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}')"
          echo "Benchmark signer SHA-256: ${ACTUAL_SHA256}"
          test "${ACTUAL_SHA256}" = "${EXPECTED_APK_SIGNER_SHA256}"

      - name: Prepare artifact
        id: artifact
        env:
          APK_PATH: ${{ steps.meta.outputs.apk-path }}
          APK_FILE_NAME: ${{ steps.meta.outputs.apk-file-name }}
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact-name }}
        run: |
          set -euo pipefail
          cp "${APK_PATH}" "${RUNNER_TEMP}/${APK_FILE_NAME}"
          echo "apk_file_name=${APK_FILE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload benchmark APK
        id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.artifact.outputs.apk_file_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Write artifact summary
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
          APK_FILE_NAME: ${{ steps.artifact.outputs.apk_file_name }}
          APPLICATION_ID: ${{ steps.meta.outputs.application-id }}
          VARIANT_NAME: ${{ steps.meta.outputs.variant-name }}
          VERSION_NAME: ${{ steps.meta.outputs.version-name }}
          VERSION_CODE: ${{ steps.meta.outputs.version-code }}
          COMMIT_SHA: ${{ steps.context.outputs.commit_sha }}
          APK_SHA256: ${{ steps.meta.outputs.apk-sha256 }}
          ARTIFACT_DIGEST: ${{ steps.upload_apk.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        run: |
          {
            echo "### Benchmark APK artifact"
            echo ""
            echo "- Artifact: [${ARTIFACT_NAME}](${ARTIFACT_URL})"
            echo "- File: \`${APK_FILE_NAME}\`"
            echo "- Application ID: \`${APPLICATION_ID}\`"
            echo "- Variant: \`${VARIANT_NAME}\`"
            echo "- Version: \`${VERSION_NAME}\` (\`${VERSION_CODE}\`)"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Run number: \`${GITHUB_RUN_NUMBER}\`"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Artifact archive SHA-256: \`${ARTIFACT_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
