name: Setup Android Gradle build
description: Prepare JDK, Gradle, and GitHub Packages credentials, and confirm the runner's Android SDK.

inputs:
  android-build-tools-version:
    description: Android build-tools version the build and the apksigner check need.
    required: false
    default: "37.0.0"
  android-platform-version:
    description: Android SDK platform package the build compiles against.
    required: false
    default: "android-37.0"
  android-platform-fallback-version:
    description: Fallback Android SDK platform package to install when the primary package is unavailable.
    required: false
    default: "android-37"
  java-version:
    description: JDK version to install.
    required: false
    default: "21"
  github-actor:
    description: GitHub Packages username.
    required: true
  github-token:
    description: GitHub Packages token.
    required: true
  cache-read-only:
    description: Read existing Gradle caches without writing new cache entries.
    required: false
    default: "true"
  build-scan-publish:
    description: Publish Gradle Build Scan data for this job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # Wrapper validation was its own `gradle/actions/wrapper-validation` step and another
        # action to download; setup-gradle does the same check itself, before any Gradle runs.
        validate-wrappers: true
        cache-read-only: ${{ inputs.cache-read-only }}
        cache-cleanup: on-success
        build-scan-publish: ${{ inputs.build-scan-publish }}
        build-scan-terms-of-use-url: https://gradle.com/terms-of-service
        build-scan-terms-of-use-agree: "yes"

    - name: Confirm Android SDK components
      shell: bash
      env:
        ANDROID_BUILD_TOOLS_VERSION: ${{ inputs.android-build-tools-version }}
        ANDROID_PLATFORM_VERSION: ${{ inputs.android-platform-version }}
        ANDROID_PLATFORM_FALLBACK_VERSION: ${{ inputs.android-platform-fallback-version }}
      run: |
        set -euo pipefail

        # The pinned Ubuntu 26.04 image ships the Android SDK: ANDROID_HOME is exported for every
        # step, the licences are pre-accepted, and it currently carries both things this build
        # names -- build-tools 37.0.0 and platforms;android-37.0. So there is nothing to install
        # and no `android-actions/setup-android` in front of this. That action cost ~8s a job and
        # was also the single point of failure that took CI down when Google deleted the legacy
        # `tools` package out from under its default package list.
        #
        # This step exists for the day an image rotation drops something. It installs only what
        # is actually absent, so the normal path is a pair of directory tests, and a miss reports
        # itself here by name instead of surfacing as an AGP "Failed to install" deep in a build.
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [[ -z "${SDK_ROOT}" ]]; then
          echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set; this runner has no Android SDK."
          exit 1
        fi

        sdkmanager_path() {
          local bundled="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "${bundled}" ]]; then
            echo "${bundled}"
          else
            command -v sdkmanager
          fi
        }

        install_package() {
          local package="$1"
          local sdkmanager
          sdkmanager="$(sdkmanager_path)"
          echo "Installing ${package} with ${sdkmanager}"
          # Licences are accepted in the image, but answer anyway for the case where they are not.
          # `printf` rather than `yes`, whose SIGPIPE death would trip `set -o pipefail`.
          printf 'y\n%.0s' {1..10} | "${sdkmanager}" --channel=3 "${package}"
        }

        require_dir() {
          local label="$1" path="$2" package="$3"
          if [[ -d "${path}" ]]; then
            echo "present: ${label}"
            return 0
          fi
          echo "missing: ${label}"
          install_package "${package}"
        }

        require_dir "build-tools ${ANDROID_BUILD_TOOLS_VERSION}" \
          "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}" \
          "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

        if [[ -d "${SDK_ROOT}/platforms/${ANDROID_PLATFORM_VERSION}" ]]; then
          echo "present: platform ${ANDROID_PLATFORM_VERSION}"
        elif [[ -d "${SDK_ROOT}/platforms/${ANDROID_PLATFORM_FALLBACK_VERSION}" ]]; then
          echo "present: platform ${ANDROID_PLATFORM_FALLBACK_VERSION} (fallback)"
        elif install_package "platforms;${ANDROID_PLATFORM_VERSION}"; then
          echo "Installed SDK platform: ${ANDROID_PLATFORM_VERSION}"
        else
          install_package "platforms;${ANDROID_PLATFORM_FALLBACK_VERSION}"
          echo "Installed SDK platform: ${ANDROID_PLATFORM_FALLBACK_VERSION}"
        fi

    - name: Prepare Gradle credentials for GitHub Packages
      shell: bash
      env:
        GPR_USER: ${{ inputs.github-actor }}
        GPR_KEY: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        mkdir -p "${HOME}/.gradle"
        {
          echo "gpr.user=${GPR_USER}"
          echo "gpr.key=${GPR_KEY}"
        } >> "${HOME}/.gradle/gradle.properties"

    - name: Prepare KeiOS version metadata
      shell: bash
      run: |
        set -euo pipefail

        release_target_version="1.19.0"
        semver_ge() {
          local left_major left_minor left_patch right_major right_minor right_patch
          IFS='.' read -r left_major left_minor left_patch <<< "$1"
          IFS='.' read -r right_major right_minor right_patch <<< "$2"

          if ((left_major != right_major)); then
            ((left_major > right_major))
            return
          fi
          if ((left_minor != right_minor)); then
            ((left_minor > right_minor))
            return
          fi
          ((left_patch >= right_patch))
        }

        latest_tag="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
        if [[ -z "${latest_tag}" ]]; then
          latest_tag="v${release_target_version}"
        fi
        release_version="${latest_tag#v}"
        if semver_ge "${release_target_version}" "${release_version}"; then
          release_version="${release_target_version}"
        fi

        IFS='.' read -r major minor patch <<< "${release_version}"
        next_patch="$((patch + 1))"
        next_version="${major}.${minor}.${next_patch}"

        relative_count="$(git rev-list --count "${latest_tag}..HEAD" 2>/dev/null || echo 0)"
        total_count="$(git rev-list --count HEAD 2>/dev/null || echo 0)"
        short_hash="$(git rev-parse --short=12 HEAD)"
        branch_name="$(git rev-parse --abbrev-ref HEAD | tr -c 'A-Za-z0-9._-' '-')"
        dirty="false"
        if [[ -n "$(git status --porcelain)" ]]; then
          dirty="true"
        fi
        timestamp_millis="$(($(date +%s) * 1000))"

        {
          echo "keios.version.name=${release_version}"
          echo "keios.nextVersion.name=${next_version}"
          echo "keios.version.anchorTag=${latest_tag}"
          echo "keios.git.available=true"
          echo "keios.git.relativeCommitCount=${relative_count}"
          echo "keios.git.totalCommitCount=${total_count}"
          echo "keios.git.shortHash=${short_hash}"
          echo "keios.git.branchName=${branch_name}"
          echo "keios.git.worktreeDirty=${dirty}"
          echo "keios.build.timestampMillis=${timestamp_millis}"
        } >> "${HOME}/.gradle/gradle.properties"

        echo "KeiOS release version: ${release_version}"
        echo "KeiOS benchmark/debug version: ${next_version}+${relative_count}.g${short_hash}"
